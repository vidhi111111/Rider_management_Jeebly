<div class="layout">
  <header class="header">
    <div class="header-left">
      <button
        type="button"
        class="menu-button"
        (click)="toggleSidebar()"
        aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="brand">
        <h2>Jeebly</h2>
      </div>
    </div>

   
<div class="header-right">
  <span class="welcome-text" *ngIf="currentUser">
    Welcome, {{ currentUser.name }}
  </span>

  <div class="profile-menu">
    <button
      type="button"
      class="profile-trigger"
      (click)="toggleProfileMenu()"
      [attr.aria-expanded]="isProfileMenuOpen"
      aria-label="Open profile menu">

      <span class="profile-avatar">
        {{ getUserInitial() }}
      </span>
    </button>

    <div
      class="profile-dropdown"
      *ngIf="isProfileMenuOpen">

      <button
        type="button"
        class="dropdown-item"
        (click)="openProfile()">
        <span class="dropdown-icon">♙</span>
        <span class="dropdown-label">
          <strong>Profile</strong>
          <small>View and edit your account</small>
        </span>
        <span class="item-chevron">›</span>
      </button>

      <button
        type="button"
        class="dropdown-item"
        (click)="openChangePassword()">
        <span class="dropdown-icon">♧</span>
        <span class="dropdown-label">
          <strong>Change Password</strong>
          <small>Update your password</small>
        </span>
        <span class="item-chevron">›</span>
      </button>

      <button
        type="button"
        class="dropdown-item"
        (click)="toggleTheme()">
        <span class="dropdown-icon">
          {{ isDarkMode ? '☀' : '☾' }}
        </span>
        <span class="dropdown-label">
          <strong>
            {{ isDarkMode ? 'Light Theme' : 'Dark Theme' }}
          </strong>
          <small>
            {{ isDarkMode ? 'Switch to light appearance' : 'Switch to dark appearance' }}
          </small>
        </span>
        <span
          class="theme-switch"
          [class.theme-switch-active]="isDarkMode">
          <span></span>
        </span>
      </button>

      <div class="dropdown-divider"></div>

      <button
        type="button"
        class="dropdown-item logout-dropdown-item"
        (click)="logout()">
        <span class="dropdown-icon">⇥</span>
        <span class="dropdown-label">
          <strong>Logout</strong>
          <small>Sign out of your account</small>
        </span>
      </button>
    </div>
  </div>
</div>
</header>

  <div
    class="sidebar-overlay"
    [class.show]="isSidebarOpen"
    (click)="closeSidebar()">
  </div>

  <div class="body-container">
    <aside
      class="sidebar"
      [class.sidebar-open]="isSidebarOpen">

      <div class="sidebar-heading">
        MENU
      </div>

      <nav class="sidebar-menu">
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeSidebar()">
          <span>Dashboard</span>
        </a>

        <a
          routerLink="/orders"
          routerLinkActive="active"
          (click)="closeSidebar()">
          <span>Orders</span>
        </a>

        <a
          routerLink="/riders"
          routerLinkActive="active"
          (click)="closeSidebar()">
          <span>Riders</span>
        </a>
      </nav>
    </aside>

    <main class="content">
      <app-breadcrumb></app-breadcrumb>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
